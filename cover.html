<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CAbook Encyclopedia — Cover</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #e8f0ff, #ffffff);
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }

  .cover-container {
    text-align: center;
    padding: 60px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    max-width: 700px;
  }

  h1 {
    font-size: 2.5em;
    color: #004aad;
    margin-bottom: 10px;
  }

  h2 {
    font-size: 1.4em;
    color: #333;
    font-weight: normal;
    margin-bottom: 30px;
  }

  .byline {
    font-size: 1.1em;
    color: #666;
    margin-top: 40px;
  }

  .button {
    display: inline-block;
    margin-top: 40px;
    padding: 12px 25px;
    font-size: 1em;
    color: #fff;
    background-color: #004aad;
    text-decoration: none;
    border-radius: 8px;
    transition: background-color 0.2s ease;
  }

  .button:hover {
    background-color: #003780;
  }
</style>
</head>
<body>
  <div class="cover-container">
    <h1>CAbook Encyclopedia</h1>
    <h2>Climate and Environment Knowledge Encyclopedia</h2>
    <p class="byline">Created by <strong>semanticClimate</strong></p>

    <a href="index.html" class="button">Enter Encyclopedia →</a>
  </div>
</body>
</html>
