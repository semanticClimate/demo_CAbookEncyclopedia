                  nodes = new vis.DataSet([{"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Academy", "label": "Academy", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Archiginnasio_ora_blu_Bologna.jpg/250px-Archiginnasio_ora_blu_Bologna.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eAcademy\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eAcademy Q162633 An academy ( Attic Greek : \u1f08\u03ba\u03b1\u03b4\u03ae\u03bc\u03b5\u03b9\u03b1 ; Koine Greek : \u1f08\u03ba\u03b1\u03b4\u03b7\u03bc\u03af\u03b1 ) is an institution of tertiary education . The name traces back to Plato \u0027s school of philosophy, founded c. 386 BC at Akademia , a sanctuary of Athena , the goddess of wisdom and skill, north of Athens , Greece. The Royal Spanish Academy defines an academy as a scientific, literary or artistic society established with public authority and as a teaching establishment, public or private, of a professional, artistic, te...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "agriculture", "label": "agriculture", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/PivotWithDrops.JPG/250px-PivotWithDrops.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eagriculture\u003c/h3\u003e\n            \u003cdiv style=\u "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Parthenon_%2830276156187%29.jpg/250px-Parthenon_%2830276156187%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eAncient Greeks\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eAncient Greeks Q11772 Ancient Greece ( Ancient Greek : \u1f19\u03bb\u03bb\u03ac\u03c2 , romanized : Hell\u00e1s ) was a northeastern Mediterranean civilization, existing from the Greek Dark Ages of the 12th\u20139th centuries BC to the end of classical antiquity ( c. 600 AD ), that comprised a loose collection of culturally and linguistically related city-states and communities. Prior to the Roman period , most of these regions were officially unified only once under the Kingdom of Macedon from 338 to 323 BC. In Western history ,...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Antarctica", "label": "Antarctica", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Antarctica_%28orthographic_projection%29.svg/250px-Antarctica_%28orthographic_projection%29.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eAntarctica\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eAntarctica Q51 Antarctica ( / \u00e6 n \u02c8 t \u0251\u02d0r k t \u026a k \u0259 / \u24d8 ) is Earth \u0027s southernmost and least-populated continent . Situated almost entirely south of the Antarctic Circle and surrounded by the Southern Ocean (also known as the Antarctic Ocean), it contains the geographic South Pole . Antarctica is the fifth-largest continent, being about 40% larger than Europe , and has an area of 14,200,000 km 2 (5,500,000 sq mi). Most of Antarctica is covered by the Antarctic ice sheet , with an average thickne...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Anthropocene", "label": "Anthropocene", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/Earth%27s_City_Lights_by_DMSP%2C_1994-1995_%28large%29.jpg/250px-Earth%27s_City_Lights_by_DMSP%2C_1994-1995_%28large%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eAnthropocene\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eAnthropocene Q26841 Anthropocene is a term that has been used to refer to the period of time during which humanity has become a planetary force of change . It appears in scientific and social discourse, especially with respect to accelerating geophysical and biochemical changes that characterize the 20th and 21st centuries on Earth. Originally a proposal for a new geological epoch following the Holocene , it was rejected as such in 2024 by the International Commission on Stratigraphy (ICS) and t...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "anxiety", "label": "anxiety", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Edvard_Munch%2C_1893%2C_The_Scream%2C_oil%2C_tempera_and_pastel_on_cardboard%2C_91_x_73_cm%2C_National_Gallery_of_Norway.jpg/250px-Edvard_Munch%2C_1893%2C_The_Scream%2C_oil%2C_tempera_and_pastel_on_cardboard%2C_91_x_73_cm%2C_National_Gallery_of_Norway.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eanxiety\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eAnxiety Q154430 Anxiety is an emotion characterised by an unpleasant state of inner turmoil and includes feelings of dread over anticipated events. Anxiety is different from fear in that fear is defined as the emotional response to a present threat , whereas anxiety is the anticipation of a future one. It is often accompanied by nervous behaviour such as pacing back and forth, somatic complaints , and rumination . Anxiety underlies The Scream (1893) by Edvard Munch , which grapples with a comple...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Aristotle", "label": "Aristotle", "shape": "dot", "size": 15.399999999999999, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/ae/Aristotle_Altemps_Inv8575.jpg/250px-Aristotle_Altemps_Inv8575.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eAristotle\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eAristotle Q868 Aristotle ( Attic Greek : \u1f08\u03c1\u03b9\u03c3\u03c4\u03bf\u03c4\u03ad\u03bb\u03b7\u03c2 , romanized: Aristot\u00e9l\u0113s ; 384\u2013322 BC) was an ancient Greek philosopher and polymath . His writings cover a broad range of subjects spanning the natural sciences , philosophy , linguistics , economics , politics , psychology , and the arts . As the founder of the Peripatetic school of philosophy in the Lyceum in Athens , he began the wider Aristotelian tradition that followed, which set the groundwork for the development of modern science .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Art", "label": "Art", "shape": "dot", "size": 13.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/34/Art-portrait-collage_2.jpg/500px-Art-portrait-collage_2.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eArt\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eArt Q735 Art is a diverse range of cultural activity centered around works utilizing creative or imaginative talents, which are expected to evoke a worthwhile experience, generally through an expression of emotional power, conceptual ideas, technical proficiency, or beauty . Visual artworks : (clockwise from upper left) an 1887 self-portrait by Vincent van Gogh ; a female ancestor figure by a Chokwe artist; detail from The Birth of Venus ( c. 1484 \u20131486) by Sandro Botticelli ; and an Okinawan Sh...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "astronauts", "label": "astronauts", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/Bruce_McCandless_II_during_EVA_in_1984.jpg/250px-Bruce_McCandless_II_during_EVA_in_1984.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eastronauts\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eAstronauts Q11631 An astronaut (from the Ancient Greek \u1f04\u03c3\u03c4\u03c1\u03bf\u03bd ( astron ), meaning \u0027star\u0027, and \u03bd\u03b1\u03cd\u03c4\u03b7\u03c2 ( nautes ), meaning \u0027sailor\u0027) is a person trained, equipped, and deployed by a human spaceflight program to serve as a commander or crew member of a spacecraft . Although generally reserved for professional space travelers, the term is sometimes applied to anyone who travels into space, including scientists, politicians, journalists, and space tourists . In the United States, it is a designated t...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Athens", "label": "Athens", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/25/Map_athenian_empire_431_BC-no.svg/250px-Map_athenian_empire_431_BC-no.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eAthens\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eMerge synonyms Athenians Q1524 Synonyms: Athenians Athens (canonical) Athens is the capital and largest city of Greece . A significant coastal urban area in the Mediterranean, Athens is also the capital of the Attica region and is the southernmost capital on the European mainland . With its urban area\u0027s population numbering over 3.6 million, it is the eighth-largest urban area in the European Union (EU). The Municipality of Athens (also City of Athens), which constitutes a small administrative u...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Bangladesh", "label": "Bangladesh", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eBangladesh\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eBangladesh Q902 Bangladesh , officially the People\u0027s Republic of Bangladesh , is a country in South Asia . It is the eighth-most populous country in the world and among the most densely populated with a population of over 174 million within an area of 148,460 square kilometres (57,320 sq mi). Bangladesh shares land borders with India to the north, west, and east, and Myanmar to the southeast. It has a coastline along the Bay of Bengal to its south and is separated from Bhutan and Nepal by the Si...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "beauty", "label": "beauty", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/77/Rozeta_Pary%C5%BC_notre-dame_chalger.jpg/330px-Rozeta_Pary%C5%BC_notre-dame_chalger.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ebeauty\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eBeauty Q7242 Beauty is commonly described as a feature of objects that makes them pleasurable to perceive. Such objects include landscapes, sunsets, humans and works of art. Beauty, art and taste are the main subjects of aesthetics , one of the fields of study within philosophy . As a positive aesthetic value, it is contrasted with ugliness as its negative counterpart. A Rayonnant style rose window in Notre-Dame de Paris . In Gothic architecture , light was considered \"the source and actual esse...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Belgium", "label": "Belgium", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/ba/Map_Gallia_Tribes_Towns.png/250px-Map_Gallia_Tribes_Towns.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eBelgium\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eBelgium Q31 Belgium , officially the Kingdom of Belgium , is a country in Northwestern Europe . Situated in a coastal lowland region known as the Low Countries , it is bordered by the Netherlands to the north, Germany to the east, Luxembourg to the southeast, France to the south, and the North Sea to the west. The country also shares a maritime boundary with the United Kingdom to the northwest. Belgium covers an area of 30,689 km 2 (11,849 sq mi) and has a population of more than 11.8 million; i...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "belief", "label": "belief", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Classical_definition_of_Kno.svg/250px-Classical_definition_of_Kno.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ebelief\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eMerge synonyms Beliefs Q34394 Synonyms: belief (canonical) beliefs A belief is a subjective attitude that something is true or a state of affairs is the case. A subjective attitude is a mental state of having some stance , take, or opinion about something. In epistemology , philosophers use the term belief to refer to attitudes about the world which can be either true or false . To believe something is to take it to be true; for instance, to believe that snow is white is comparable to accepting ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Bengal Famine", "label": "Bengal Famine", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eBengal Famine\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eBengal Famine Q4887665 There have been several significant famines in the history of Bengal (now independent Bangladesh and the Indian state of West Bengal ) including:\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Bible", "label": "Bible", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/Bible_from_1300_%2820%29.jpg/250px-Bible_from_1300_%2820%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eBible\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eBible Q1845 The Bible is a collection of religious texts that are central to Christianity and Judaism , and esteemed in other Abrahamic religions such as Islam . The Bible is an anthology (a compilation of texts of a variety of forms) originally written in Hebrew (with some parts in Aramaic ) and Koine Greek . The texts include instructions, stories, poetry , prophecies , and other genres. The collection of materials accepted as part of the Bible by a particular religious tradition or community ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "biodiversity", "label": "biodiversity", "shape": "dot", "size": 14.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Fungi_of_Saskatchewan.JPG/250px-Fungi_of_Saskatchewan.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ebiodiversity\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eBiodiversity Q47041 Biodiversity is the variability of life on Earth . It can be measured on various levels, for example, genetic variability , species diversity , ecosystem diversity and phylogenetic diversity. Diversity is not distributed evenly on Earth \u2014it is greater in the tropics as a result of the warm climate and high primary productivity in the region near the equator . Tropical forest ecosystems cover less than one-fifth of Earth\u0027s terrestrial area and contain about 50% of the world\u0027s ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "biodiversity loss", "label": "biodiversity loss", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b0/Summary_of_major_environmental-change_categories_expressed_as_a_percentage_change_%28red%29_relative_to_baseline_-_fcosc-01-615419-g001.jpg/250px-Summary_of_major_environmental-change_categories_expressed_as_a_percentage_change_%28red%29_relative_to_baseline_-_fcosc-01-615419-g001.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ebiodiversity loss\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eBiodiversity loss Q18466271 Biodiversity loss happens when species disappear completely from Earth ( extinction ) or when there is a decrease or disappearance of species in a specific area. Biodiversity loss means that there is a reduction in biological diversity in a given area. The decrease can be temporary or permanent. It is temporary if the damage that led to the loss is reversible in time, for example through ecological restoration . If this is not possible, then the decrease is permanent....\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Biology", "label": "Biology", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/ab/Neurology%2C_19th_century%3B_cell_of_Schwann._Wellcome_L0002015.jpg/250px-Neurology%2C_19th_century%3B_cell_of_Schwann._Wellcome_L0002015.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eBiology\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eBiology Q420 Biology is the scientific study of life and living organisms . It is a broad natural science that encompasses a wide range of fields and unifying principles that explain the structure, function, growth, origin , evolution , and distribution of life. Central to biology are five fundamental themes: the cell as the basic unit of life, genes and heredity as the basis of inheritance, evolution as the driver of biological diversity , energy transformation for sustaining life processes, an...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "biomass", "label": "biomass", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d6/Rice_chaffs.jpg/250px-Rice_chaffs.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ebiomass\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eBiomass Q18537 Biomass is material produced by the growth of microorganisms , plants or animals . Beyond this general definition, there are differences in how the term is used and applied depending on industry or subject-matter norms. For example, it may be more narrowly defined as just plant matter, or as a combination of plant and animal matter. A collection of rice husks, an example of lignocellulosic biomass .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "biosphere", "label": "biosphere", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/44/Seawifs_global_biosphere.jpg/250px-Seawifs_global_biosphere.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ebiosphere\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eBiosphere Q42762 The biosphere (from Ancient Greek \u03b2\u03af\u03bf\u03c2 ( b\u00edos ) \u0027 life \u0027 and \u03c3\u03c6\u03b1\u1fd6\u03c1\u03b1 ( spha\u00eera ) \u0027 sphere \u0027 ), also called the ecosphere (from Ancient Greek \u03bf\u1f36\u03ba\u03bf\u03c2 ( o\u00eekos ) \u0027 settlement, house \u0027 and \u03c3\u03c6\u03b1\u1fd6\u03c1\u03b1 ( spha\u00eera ) \u0027 sphere \u0027 ), is the worldwide sum of all ecosystems . It can also be termed the zone of life on the Earth . The biosphere (which is technically a spherical shell ) is virtually a closed system with regard to matter , with minimal inputs and outputs. Regarding energy , it is an ope...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "capitalism", "label": "capitalism", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/bf/Jacopo_Pontormo_055.jpg/250px-Jacopo_Pontormo_055.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecapitalism\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eMerge synonyms Capitalism Q6206 Synonyms: capitalism (canonical) capitalist economy Capitalism is an economic system based on the private ownership of the means of production and its use for the purpose of obtaining profit . This socioeconomic system has developed historically in several stages, and is defined by a number of constituent elements: private property , profit motive , capital accumulation , competitive markets , commodification , wage labor , and an emphasis on innovation and econom...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Capitalocene", "label": "Capitalocene", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/78/McConnel_%26_Company_mills%2C_about_1820.jpg/500px-McConnel_%26_Company_mills%2C_about_1820.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eCapitalocene\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eCapitalocene Q113834036 The Capitalocene is a critique of \"man versus nature\" thinking in climate politics. Frequently misunderstood as an alternative geological periodization to the Anthropocene proposal, the Capitalocene\u0027s leading proponents argue for the centrality of capitalism in the making of climate crisis. The Capitalocene is a way to understand capitalism as a geohistorical process, not a geological event as conventionally understood. For Andreas Malm, this is the theory of fossil capit...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Chemistry", "label": "Chemistry", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/C%C3%ADn.png/120px-C%C3%ADn.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eChemistry\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eChemistry Q2329 Chemistry is the scientific study of the properties and behavior of matter . It is a physical science within the natural sciences that studies the chemical elements that make up matter and compounds made of atoms , molecules and ions : their composition, structure, properties, behavior and the changes they undergo during reactions with other substances . Chemistry also addresses the nature of chemical bonds in chemical compounds .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "China", "label": "China", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/CHN_orthographic.svg/250px-CHN_orthographic.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eChina\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eChina Q148 China , officially the People\u0027s Republic of China ( PRC ), is a country in East Asia . It is the second-most populous country after India , with a population exceeding 1.4 billion, representing 17% of the world\u0027s population. China borders fourteen countries by land across an area of 9.6 million square kilometers (3,700,000 sq mi), making it the third-largest country by area . The country is divided into 33 province-level divisions : 22 provinces , 5 autonomous regions , 4 municipaliti...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "circular economy", "label": "circular economy", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/67/Linia_kontra%C5%AD_Cirkulero.svg/500px-Linia_kontra%C5%AD_Cirkulero.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecircular economy\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eCircular economy Q497743 Circular economy (CE), also referred to as circularity , is a model of resource production and consumption that involves sharing , leasing, reusing , repairing, refurbishing, and recycling materials and products, to extend product life cycle for as long as possible. The concept aims to tackle global challenges such as climate change , biodiversity loss , waste , and pollution by emphasizing the design-based implementation of the three base principles of the model. The ma...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Civil Rights Act", "label": "Civil Rights Act", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/dc/Flickr_-_USCapitol_-_Civil_Rights_Bill_Passes%2C_1866.jpg/250px-Flickr_-_USCapitol_-_Civil_Rights_Bill_Passes%2C_1866.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eCivil Rights Act\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eCivil Rights Act Q404355 Civil Rights Act may refer to several civil right acts in the United States . These acts of the United States Congress are meant to protect rights to ensure individuals \u0027 freedom from infringement by governments , social organizations , and private individuals. Allyn Cox \u0027s mural of the passage of the act\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Civil Rights Movement", "label": "Civil Rights Movement", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/Civil_Rights_March_on_Washington%2C_D.C._%28Leaders_marching_from_the_Washington_Monument_to_the_Lincoln_Memorial%29_-_NARA_-_542010.jpg/330px-Civil_Rights_March_on_Washington%2C_D.C._%28Leaders_marching_from_the_Washington_Monument_to_the_Lincoln_Memorial%29_-_NARA_-_542010.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eCivil Rights Movement\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eCivil Rights Movement Q48537 Martin Luther King Jr. James Bevel Rosa Parks\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "climat e change", "label": "climat e change", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Common_Era_Temperature.svg/500px-Common_Era_Temperature.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimat e change\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eMerge synonyms Climate change Q125928 Synonyms: climat e change (canonical) climate change global warming Present-day climate change includes both global warming \u2014the ongoing increase in global average temperature \u2014and its wider effects on Earth\u0027s climate system . Climate change in a broader sense also includes previous long-term changes to Earth\u0027s climate . The modern-day rise in global temperatures is driven by human activities , especially fossil fuel ( coal , oil and natural gas ) burning si...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "climate", "label": "climate", "shape": "dot", "size": 13.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/K%C3%B6ppen-Geiger_climate_classification_%281980-2016%29.png/250px-K%C3%B6ppen-Geiger_climate_classification_%281980-2016%29.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eClimate Q7937 Climate is the long-term weather pattern in a region, typically averaged over 30 years. More rigorously, it is the mean and variability of meteorological variables over a time spanning from months to millions of years. Some of the meteorological variables that are commonly measured are temperature , humidity , atmospheric pressure , wind , and precipitation . In a broader sense, climate is the state of the components of the climate system , including the atmosphere , hydrosphere , ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "climate action", "label": "climate action", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate action\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eClimate action Q22661680 Climate action (or climate change action ) refers to a range of activities, mechanisms, policy instruments, and so forth that aim at reducing the severity of human-induced climate change and its impacts . \"More climate action\" is a central demand of the climate movement . Climate inaction is the absence of climate action.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "climate activism", "label": "climate activism", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/8a/Ende_Gel%C3%A4nde_November_2017_-_Front_banner_of_demonstration.jpg/250px-Ende_Gel%C3%A4nde_November_2017_-_Front_banner_of_demonstration.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate activism\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eClimate activism Q18746339 The climate movement is a global social movement focused on pressuring governments and industry to take action (also called climate activism or climate action ) addressing the causes and impacts of climate change . Citizens, environmental non-profit organizations , and companies have engaged in significant climate activism since the late 1980s and early 1990s, as they sought to influence the United Nations Framework Convention on Climate Change (UNFCCC) . Climate activ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "climate education", "label": "climate education", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Figure_1_Whole_school_approach_to_climate_change_Getting_Climate-Ready.svg/250px-Figure_1_Whole_school_approach_to_climate_change_Getting_Climate-Ready.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate education\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eClimate education Q30606503 Climate change education (CCE) is education that aims to address and develop effective responses to climate change . It helps learners understand the causes and consequences of climate change, prepares them to live with the impacts of climate change and empowers learners to take appropriate actions to adopt more sustainable lifestyles . Climate change and climate change education are global challenges that can be anchored in the curriculum in order to provide local le...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "climate justice", "label": "climate justice", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Greta_Thunberg_und_Luisa_Neubauer_demonstrieren_mit_Fridays_For_Future.jpg/250px-Greta_Thunberg_und_Luisa_Neubauer_demonstrieren_mit_Fridays_For_Future.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate justice\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eClimate justice Q1291678 Climate justice is a type of environmental justice that focuses on the unequal impacts of climate change on marginalized or otherwise vulnerable populations. Climate justice seeks to achieve an equitable distribution of both the burdens of climate change and the efforts to mitigate climate change through advocacy and policy change. The economic burden of climate change mitigation is estimated by some at around 1% to 2% of GDP . Climate justice examines concepts such as e...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "climate modelling", "label": "climate modelling", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/20250712_Climate_model_inputs_and_outputs.svg/500px-20250712_Climate_model_inputs_and_outputs.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate modelling\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eClimate modelling Q620920 Numerical climate models (or climate system models ) are mathematical models that can simulate the interactions of important drivers of climate . These drivers are the atmosphere , oceans , land surface and ice . Scientists use climate models to study the dynamics of the climate system and to make projections of future climate and of climate change . Climate models can also be qualitative (i.e. not numerical) models and contain narratives, largely descriptive, of possib...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "climate science", "label": "climate science", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/K%C3%B6ppen-Geiger_climate_classification_%281980-2016%29.png/500px-K%C3%B6ppen-Geiger_climate_classification_%281980-2016%29.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate science\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eClimate science Q52139 Climatology (from Greek \u03ba\u03bb\u03af\u03bc\u03b1 , klima , \"slope\"; and -\u03bb\u03bf\u03b3\u03af\u03b1 , -logia ) or climate science is the scientific study of Earth\u0027s climate , typically defined as weather conditions averaged over a period of at least 30 years. Climate concerns the atmospheric condition during an extended to indefinite period of time; weather is the condition of the atmosphere during a relative brief period of time. The main topics of research are the study of climate variability , mechanisms of c...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "climate scientists", "label": "climate scientists", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate scientists\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eClimate scientists Q6610163 This list of climate scientists contains famous or otherwise notable persons who have contributed to the study of climate science . The list is compiled manually, so will not be complete, up to date, or comprehensive. The list includes scientists from several specialities or disciplines.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "climate system", "label": "climate system", "shape": "dot", "size": 13.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Climate-system.jpg/330px-Climate-system.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eclimate system\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eClimate system Q3509184 Earth\u0027s climate system is a complex system with five interacting components: the atmosphere (air), the hydrosphere (water), the cryosphere (ice and permafrost), the lithosphere (earth\u0027s upper rocky layer) and the biosphere (living things). Climate is the statistical characterization of the climate system. It represents the average weather , typically over a period of 30 years, and is determined by a combination of processes, such as ocean currents and wind patterns. Circu...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "cognitive dissonance", "label": "cognitive dissonance", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/Clark_Stanley%27s_Snake_Oil_Liniment.png/250px-Clark_Stanley%27s_Snake_Oil_Liniment.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ecognitive dissonance\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eCognitive dissonance Q209722 In the field of psychology , cognitive dissonance is described as a mental phenomenon in which people unknowingly or subconsciously hold fundamentally conflicting cognitions. Being confronted by situations that create this dissonance or highlight these inconsistencies motivates change in their cognitions or actions to reduce this dissonance, maybe by changing a belief, by explaining something away, or by taking actions that reduce perceived inconsistency. After perfo...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "colonialism", "label": "colonialism", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/De_handelsloge_van_de_VOC_in_Hougly_in_Bengalen_Rijksmuseum_SK-A  through the exercise of imagination . The products of creativity may be classified as either intangible or physical. Intangible products of creativity include ideas , scientific theories , literary works , musical compositions , and jokes . Physical products of creativity include inventions , dishes or meals, pieces of jewelry , costumes , and paintings . A picture of an incandescent light bulb , a symbol ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "CRISPR", "label": "CRISPR", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Crispr.png/330px-Crispr.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eCRISPR\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eCRISPR Q412563 CRISPR ( / \u02c8 k r \u026a s p \u0259r / ; acronym for clustered regularly interspaced short palindromic repeats ) is a family of DNA sequences found in the genomes of prokaryotic organisms such as bacteria and archaea . Each sequence within an individual prokaryotic CRISPR is derived from a DNA fragment of a bacteriophage that had previously infected the prokaryote or one of its ancestors. These sequences are used to detect and destroy DNA from similar bacteriophages during subsequent infecti...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "critical thinking", "label": "critical thinking", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia in and which may cause public harm. Disinformation is an orchestrated adversarial activity in which actors employ strategic deceptions and media manipulation tactics to advance political, military, or commercial goals. Disinformation is implemented through coordinated campaigns that \"weaponize multiple rhetorical strategies and forms of knowing\u2014incl...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "DNA", "label": "DNA", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/DNA_Structure%2BKey%2BLabelled.pn_NoBB.png/330px-DNA_Structure%2BKey%2BLabelled.pn_NoBB.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eDNA\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eDNA Q7430 Deoxyribonucleic acid ( pronunciation \u24d8 ; DNA ) is a polymer composed of two polynucleotide chains that coil around each other to form a double helix . The polymer carries genetic instructions for the development, functioning, growth and reproduction of all known organisms and many viruses . DNA and ribonucleic acid (RNA) are nucleic acids . Alongside proteins , lipids and complex carbohydrates ( polysaccharides ), nucleic acids are one of the four major types of macromolecules that ar...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "drought", "label": "drought", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/dd/Fields_o tropy in a production system.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Equator", "label": "Equator", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/0/0b/Solstice_revolving_earth.gif\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eEquator\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eEquator Q23538 The equator is the circle of latitude that divides Earth into the Northern and Southern Hemispheres . It is an imaginary line located at 0 degrees latitude , about 21,639 nautical miles (40,075 kilometres; 24,902 miles) in circumference, halfway between the North and South Poles. The term can also be used for any other celestial body that is roughly spherical. The equator (yellow line) at the December solstice. The direction of the Sun is to the left.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Ethics", "label": "Ethics", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/05/Head_of_Aristotle.jpg/250px-Head_of_Aristotle.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eEthics\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eEthics Q9465 Ethics is the philosophical study of moral phenomena. Also called moral philosophy , it investigates normative questions about what people ought to do or which behavior is morally right. Its main branches include normative ethics , applied ethics , and metaethics . According to Aristotle , how to lead a good life is one of the central questions of ethics.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Europe", "label": "Europe", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/15/Anaximander_world_map_%28mul%29.svg/250px-Anaximander_world_map_%28mul%29.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eEurope\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eEurope Q46 Europe is a continent located entirely in the Northern Hemisphere and mostly in the Eastern Hemisphere . It is bordered by the Arctic Ocean to the north, the Atlantic Ocean to the west, the Mediterranean Sea to the south, and Asia to the east. Europe shares the landmass of Eurasia with Asia , and of Afro-Eurasia with both Africa and Asia. Europe is commonly considered to be separated from Asia by the watershed of the Ural Mountains , the Ural River , the Caspian Sea , the Greater Cauc...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "existential crisis", "label": "existential crisis", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/ef/Existential_crisis.jpg/250px-Existential_crisis.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eexistential crisis\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eExistential crisis Q2603358 Existential crises are inner conflicts characterized by the impression that life lacks meaning and by confusion about one\u0027s personal identity . They are accompanied by anxiety and stress , often to such a degree that they disturb one\u0027s normal functioning in everyday life and lead to depression . Their negative attitude towards meaning reflects characteristics of the philosophical movement of existentialism . The components of existential crises can be divided into emo...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "external costs", "label": "external costs", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/79/Diesel-smoke.jpg/250px-Diesel-smoke.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eexternal costs\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eExternal costs Q275372 In economics , an externality is a cost or benefit to an uninvolved third party that arises as an effect of another party\u0027s (or parties\u0027) activity. Externalities can be considered as unpriced components that are involved in either consumer or producer consumption. Air pollution from motor vehicles is one example. The cost of air pollution to society is not paid by either the producers or users of motorized transport. Water pollution from mills and factories are another exa...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "extreme weather events", "label": "extreme weather events", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/A_tornado_near_Anadarko%2C_Oklahoma%2C_on_May_3%2C_1999.jpg/250px-A_tornado_near_Anadarko%2C_Oklahoma%2C_on_May_3%2C_1999.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eextreme weather events\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eExtreme weather events Q1277161 Extreme weather includes unexpected, unusual, severe , or unseasonal weather ; weather at the extremes of the historical distribution\u2014the range that has been seen in the past. Extreme events are based on a location\u0027s recorded weather history. The main types of extreme weather include heat waves , cold waves , droughts , and heavy precipitation or storm events, such as tropical cyclones . Extreme weather can have various effects, from natural hazards such as floods...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "famines", "label": "famines", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/No-nb_bldsa_6a019.jpg/500px-No-nb_bldsa_6a019.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efa ch Republic , is a country primarily located in Western Europe . Its overseas regions and territories include French Guiana in South America , Saint Pierre and Miquelon in the North Atlantic in North America , the French West Indies , and many islands in Oceania and the Indian Ocean . Metropolitan France shares borders with Belgium and Luxembourg to the north; Germany to the northeast; Switzerland to the east; Italy and Monaco to the southeast; Andorra and...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "free market", "label": "free market", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/ed/FreePrice.JPG/250px-FreePrice.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003efree market\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eFree market Q46607 In economics , a free market is an economic system in which the prices of goods and services are determined by supply and demand expressed by sellers and buyers. Such markets, as modeled, operate without the intervention of government or any other external authority. Proponents of the free market as a normative ideal contrast it with a regulated market , in which a government intervenes in supply and demand by means of various methods such as taxes or regulations . In an ideal...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "French Revolution", "label": "French Revolution", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/57/Anonymous_-_Prise_de_la_Bastille.jpg/330px-Anonymous_-_Prise_de_la_Bastille.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eFrench Revolution\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eFrench Revolution Q6534 The French Revolution was a period of political and societal change in France that began with the Estates General of 1789 and ended with the Coup of 18 Brumaire on 9 November 1799. Many of the revolution\u0027s ideas are considered fundamental principles of liberal democracy , and its values remain central to modern French political discourse. It was caused by a combination of social, political, and economic factors which the existing regime proved unable to manage.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "GDP", "label": "GDP", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f3/Gdp_worldbank%2C_World%2C_2024_%28cropped%29.svg/500px-Gdp_worldbank%2C_World%2C_2024_%28cropped%29.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eGDP\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eGDP Q12638 Gross domestic product ( GDP ) is a monetary measure of the total market value of all of the final goods and services which are produced and rendered during a specific period of time (usually a year) by a country or countries. GDP is often used to measure the economic activity of a country or region. The major components of GDP are consumption, government spending, net exports (exports minus imports), and investment. Changing any of these factors can increase the size of the economy. ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Geography", "label": "Geography", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/Theatrum_Orbis_Terrarum%2C_by_Abraham_Ortelius%2C_World%2C_1572.jpg/250px-Theatrum_Orbis_Terrarum%2C_by_Abraham_Ortelius%2C_World%2C_1572.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eGeography\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eGeography Q1071 Geography (from Ancient Greek \u03b3\u03b5\u03c9\u03b3\u03c1\u03b1\u03c6\u03af\u03b1 ge\u014dgraph\u00eda ; combining g\u00ea \u0027Earth\u0027 and gr\u00e1ph\u014d \u0027write\u0027, literally \u0027Earth writing\u0027) is the study of the lands, features, inhabitants, and phenomena of Earth . Geography is an all-encompassing discipline that seeks an understanding of Earth and its human and natural complexities \u2014not merely where objects are, but also how they have changed and come to be. While geography is specific to Earth, many concepts can be applied more broadly to other c...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "geological time", "label": "geological time", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikim
