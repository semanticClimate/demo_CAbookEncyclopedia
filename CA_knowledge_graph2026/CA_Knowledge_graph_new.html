12px;color:#ddd;line-height:1.4;\u0027\u003eGreen energy Q1962383 Energy is sustainable if it \"meets the needs of the present without compromising the ability of future generations to meet their own needs.\" Definitions of sustainable energy usually look at its effects on the environment, the economy, and society. These impacts range from greenhouse gas emissions and air pollution to energy poverty and toxic waste . Renewable energy sources such as wind , hydro , solar , and geothermal energy can cause environmental damage but are generall...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "greenhouse gases", "label": "greenhouse gases", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/04/Greenhouse-effect-t2.svg/500px-Greenhouse-effect-t2.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003egreenhouse gases\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eMerge synonyms Greenhouse gases Q167336 Synonyms: greenhouse gases (canonical) greenhouses gases Greenhouse gases ( GHGs ) are the gases in an atmosphere that trap heat, raising the surface temperature of astronomical bodies such as Earth. Unlike other gases, greenhouse gases absorb the radiations that a planet emits , resulting in the greenhouse effect . The Earth is warmed by sunlight, causing its surface to radiate heat , which is then mostly absorbed by greenhouse gases. Without greenhouse g...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Hadley Centre", "label": "Hadley Centre", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/thumb/1/1b/Hadley_Centre.svg/250px-Hadley_Centre.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eHadley Centre\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eHadley Centre Q3042001 The Met Office Hadley Centre \u2014 named in honour of George Hadley \u2014 is one of the United Kingdom \u0027s leading centres for the study of scientific issues associated with climate change . It is part of, and based at the headquarters of the Met Office in Exeter .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Hawaii", "label": "Hawaii", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eHawaii\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eHawaii Q782 Hawaii ( / h \u0259 \u02c8 w a\u026a . i / \u24d8 h\u0259- WY -ee ; Hawaiian : Hawai\u02bbi [h\u0259\u02c8v\u0250j\u0294i, h\u0259\u02c8w\u0250j\u0294i] ) is an island state of the United States, in the Pacific Ocean about 2,000 miles (3,200 km) southwest of the U.S. mainland . One of the two non-contiguous U.S. states (along with Alaska ), it is the only state not on the North American mainland, the only state that is an archipelago , the only state south of the Tropic of Cancer , one of only two states, along with Florida , with regions that have a t...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "History", "label": "History", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/03/POxy_v0017_n2099_a_01_hires_-_cropped.jpg/250px-POxy_v0017_n2099_a_01_hires_-_cropped.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eHistory\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eHistory Q309 History is the systematic study of the past , focusing primarily on the human past . As an academic discipline , it analyses and interprets evidence to construct narratives about what happened and explain why it happened. Some theorists categorize history as a social science , while others see it as part of the humanities or consider it a hybrid discipline. Similar debates surround the purpose of history\u2014for example, whether its main aim is theoretical, to uncover the truth , or pra...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Holocene", "label": "Holocene", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Mollweide.jpg/250px-Mollweide.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eHolocene\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eHolocene Q25445 The Holocene ( / \u02c8 h \u0252 l . \u0259 s i\u02d0 n , - o\u028a -, \u02c8 h o\u028a . l \u0259 -, - l o\u028a -/ ) is the current geological epoch , beginning approximately 11,700 years ago. It follows the Last Glacial Period , which concluded with the Holocene glacial retreat . The Holocene and the preceding Pleistocene together form the Quaternary period. The Holocene is an interglacial period within the ongoing glacial cycles of the Quaternary, and is equivalent to Marine Isotope Stage 1 .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "human condition", "label": "human condition", "shape": "dot", "size": 14.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/ae/StillLifeWithASkull.jpg/250px-StillLifeWithASkull.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ehuman condition\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eHuman condition Q1124515 The human condition can be defined as the characteristics and key events of human life, including birth , learning , emotion , aspiration, reason , morality , conflict, and death . This is a very broad topic that has been and continues to be pondered and analyzed from many perspectives, including those of art , biology , literature , philosophy , psychology , and religion . This painting, with symbols of life, death, and time, is an example of memento mori art.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "human history", "label": "human history", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/27/Spreading_homo_sapiens_la.svg/500px-Spreading_homo_sapiens_la.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ehuman history\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eHuman history Q200325 Human history , or world history , is the record of humankind from prehistory to the present . Modern humans evolved in Africa around 300,000 years ago and initially lived as hunter-gatherers . They migrated out of Africa during the Last Ice Age and had spread to every continent except Antarctica by the end of the Ice Age 12,000 years ago. Soon afterward, the Neolithic Revolution in West Asia brought the first systematic husbandry of plants and animals, and saw many humans ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "human population", "label": "human population", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Nuvola_apps_kaboodle.svg/20px-Nuvola_apps_kaboodle.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ehuman population\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eHuman population Q11188 In world demographics , the world population is the total number of humans currently alive. It was estimated by the United Nations to have exceeded 8 billion (8,000,000,000) on November 15, 2022. It took around 300,000 years of human prehistory and history for the human population to reach a billion and only 218 more years from there to reach 8 billion. As of 2026, the world population is approximately 8.3 billion.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "human rights", "label": "human rights", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/ee/Magna_Carta_%28British_Library_Cotton_MS_Augustus_II.106%29.jpg/330px-Magna_Carta_%28British_Library_Cotton_MS_Augustus_II.106%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ehuman rights\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eHuman rights Q8458 Human rights are universally recognized moral principles or norms that establish standards of human behavior and are often protected by both national and international laws . These rights are considered inherent and inalienable, meaning they belong to every individual simply by virtue of being human , regardless of characteristics like nationality, ethnicity, religion, gender, sexual orientation, disability, caste, or socioeconomic status. They encompass a broad range of civil...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "human sciences", "label": "human sciences", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ehuman sciences\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eHuman sciences Q1587903 Human science (or human sciences in the plural) studies the philosophical, biological , social, justice, and cultural aspects of human life. Human science aims to expand the understanding of the human world through a broad interdisciplinary approach. It encompasses a wide range of fields - including history , philosophy , sociology , psychology , justice studies, evolutionary biology , biochemistry , neurosciences , folkloristics , and anthropology . [ citation needed ] I...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "human society", "label": "human society", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/02/Ants%27_Social_Ethology.jpg/250px-Ants%27_Social_Ethology.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ehuman society\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eMerge synonyms Society Q8425 Synonyms: human society (canonical) society A society ( / s \u0259 . \u02c8 s a\u026a . \u0259 . t i / ) is a group of individuals involved in persistent social interaction or a large social group sharing the same spatial or social territory , typically subject to the same political authority and dominant cultural expectations. Societies are characterized by patterns of relationships ( social relations ) between individuals who share a distinctive culture and institutions ; a given soci...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "humour", "label": "humour", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/Hadith_imam_baqir.svg/250px-Hadith_imam_baqir.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ehumour\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eHumour Q35874 Humour ( Commonwealth English ) or humor ( American English ) is the tendency of experiences to provoke laughter and provide amusement . The term derives from the humoral medicine of the ancient Greeks , which taught that the balance of fluids in the human body, known as \"humours\" ( Latin : humor , \"body fluid\"), controlled human health and emotion. Muhammad al-Baqir\u0027s Hadith about humour: \"Indeed Allah loves those who are playful among people without obscenity.\"\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "imagination", "label": "imagination", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/Joseph_Noel_Paton_%281821-1901%29_-_Dante_Meditating_the_Episode_of_Francesca_da_Rimini_and_Paolo_Malatesta_-_0089-1901_-_Bury_Art_Museum.jpg/250px-Joseph_Noel_Paton_%281821-1901%29_-_Dante_Meditating_the_Episode_of_Francesca_da_Rimini_and_Paolo_Malatesta_-_0089-1901_-_Bury_Art_Museum.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eimagination\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eImagination Q34516 Imagination is the representation of sensations or physical objects in the mind without any immediate input of the senses . Often described as forming pictures in the mind, it is commonly equated with mental imagery , though imaginary experiences do not have to be purely visual, and can include other sensory experiences, thoughts, and emotions. Imaginings can be re-creations of past experiences, such as vivid memories with or without changes, or completely invented and possibl...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "India", "label": "India", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/bb/India_%28orthographic_projection%29.svg/250px-India_%28orthographic_projection%29.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eIndia\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eIndia Q668 India , officially the Republic of India , is a country in South Asia . It is the seventh-largest country by area ; the most populous country since 2023; and, since its independence in 1947, the world\u0027s most populous democracy. Bounded by the Indian Ocean on the south, the Arabian Sea on the southwest, and the Bay of Bengal on the southeast, it shares land borders with Pakistan to the west; China , Nepal , and Bhutan to the north; and Bangladesh and Myanmar to the east. In the Indian ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Indian economy", "label": "Indian economy", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/R16f3ncq53gc1.jpg/330px-R16f3ncq53gc1.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eIndian economy\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eIndian economy Q233623 The economy of India is a developing mixed economy with a notable public sector in strategic sectors. It is the world\u0027s fourth-largest economy by nominal GDP and the third-largest by purchasing power parity (PPP); on a per capita income basis, India ranked 136th by nominal GDP and 119th by PPP-adjusted GDP . From independence in 1947 until 1991, successive promoted protectionist economic policies, with extensive state intervention , demand-side economics , natural resource...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Industrial Revolution", "label": "Industrial Revolution", "shape": "dot", "size": 13.0, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/dc/Powerloom_weaving_in_1835.jpg/250px-Powerloom_weaving_in_1835.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eIndustrial Revolution\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eIndustrial Revolution Q2269 The Industrial Revolution , sometimes called the First Industrial Revolution in contrast to the subsequent Second Industrial Revolution , was a transitional period of the global economy toward more widespread, efficient and stable manufacturing processes, succeeding the Second Agricultural Revolution . Beginning in Great Britain around 1760, the Industrial Revolution had spread to continental Europe and the United States by about 1840. This transition included going f...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Instagram", "label": "Instagram", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Instagram_logo_2022.svg/250px-Instagram_logo_2022.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eInstagram\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eInstagram Q209330 Instagram is an American photo and short-form video sharing social networking service owned by Meta Platforms . It allows users to upload media that can be edited with filters , be organized by hashtags , and be associated with a location via geographical tagging . Posts can be shared publicly or with preapproved followers. Users can browse other users\u0027 content by tags and locations, view trending content, like photos, and follow other users to add their content to a personal f...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "IPCC", "label": "IPCC", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Intergovernmental_Panel_on_Climate_Change_Logo.svg/250px-Intergovernmental_Panel_on_Climate_Change_Logo.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eIPCC\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eIPCC Q171183 The Intergovernmental Panel on Climate Change ( IPCC ) is an intergovernmental body of the United Nations (UN). Its job is to \"provide governments at all levels with scientific information that they can use to develop climate policies \". The World Meteorological Organization (WMO) and the United Nations Environment Programme (UNEP) set up the IPCC in 1988. The UN endorsed the creation of the IPCC later that year. It has a secretariat in Geneva , Switzerland, hosted by the WMO. It ha...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "irony", "label": "irony", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/bc/Socrate_du_Louvre.jpg/250px-Socrate_du_Louvre.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eirony\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eIrony Q131361 Irony is a juxtaposition of what, on the surface, appears to be the case with what is actually or expected to be the case. Originally a rhetorical device and literary technique , irony has also come to assume a metaphysical significance with implications for one\u0027s attitude towards life. Socrates ( c. 470\u2013399 BCE) has been central to discussions of irony from his time into the present (copy of bronze head by Lysippus in the Louvre ).\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "justice", "label": "justice", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/d9/Evidence_about_Ernst_Kaltenbrunner%27s_crimes_is_presented_at_the_International_Military_Tribunal.jpg/500px-Evidence_about_Ernst_Kaltenbrunner%27s_crimes_is_presented_at_the_International_Military_Tribunal.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ejustice\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eJustice Q13189320 In its broadest sense, justice is the treatment of individuals fairly . According to the Stanford Encyclopedia of Philosophy , the most plausible candidate for a core definition comes from the Institutes of Justinian , a 6th-century codification of Roman law , where justice is defined as \"the constant and perpetual will to render to each his due\". Evidence about the Nazi Ernst Kaltenbrunner \u0027s war crimes is presented at the Nuremberg trials .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Keeling Curve", "label": "Keeling Curve", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Nuvola_apps_kaboodle.svg/20px-Nuvola_apps_kaboodle.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eKeeling Curve\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eKeeling Curve Q224858 The Keeling Curve is a graph of the annual variation and overall accumulation of carbon dioxide in the Earth\u0027s atmosphere based on continuous measurements taken at the Mauna Loa Observatory on the island of Hawaii from 1958 to the present day. The curve is named for the scientist Charles David Keeling , who started the monitoring program and supervised it until his death in 2005.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Late Victorian Holocausts", "label": "Late Victorian Holocausts", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/c/c2/Late_Victorian_Holocausts.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eLate Victorian Holocausts\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eLate Victorian Holocausts Q6495359 Late Victorian Holocausts: El Ni\u00f1o Famines and the Making of the Third World is a 2000 history book by Mike Davis about the connection between political economy and global climate patterns , particularly the impact of colonialism and the introduction of capitalism during the El Ni\u00f1o\u2013Southern Oscillation related famines of 1876\u20131878, 1896\u20131897, and 1899\u20131902 across multiple continents. The book\u0027s main conclusion is that the deaths of 30\u201360 million people killed ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "legislation", "label": "legislation", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/6/6 th , and none is immortal . Many philosophical definitions of living systems have been proposed, such as self-organizing systems. Defining life is further complicated by viruses , which r...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "literature", "label": "literature", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/Biblioth%C3%A8que_de_l%27Assembl%C3%A9e_Nationale_%28Lunon%29.jpg/330px-Biblioth%C3%A8que_de_l%27Assembl%C3%A9e_Nationale_%28Lunon%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eliterature\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eLiterature Q8242 Literature is any collection of written work. The term is also used more narrowly for writings considered an art form, especially novels , plays , and poems . It includes both print and digital writing . In recent centuries, the definition has expanded to include oral literature , much of which has been transcribed. Literature is a method of recording, preserving, and transmitting knowledge and entertainment . It can also have a social, psychological, spiritual, or political rol...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Luxembourg", "label": "Luxembourg", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/EU-Luxembourg.svg/250px-EU-Luxembourg.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eLuxembourg\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eLuxembourg Q32 \u2013 in Europe (light green \u0026 dark grey) \u2013 in the European Union (light green) \u2013 [ Legend ]\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Mamie Till", "label": "Mamie Till", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/Mamie_Till_1955.jpg/250px-Mamie_Till_1955.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMamie Till\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eMamie Till Q4982838 Mamie Elizabeth Till-Mobley (born Mamie Elizabeth Carthan ; November 23, 1921 \u2013 January 6, 2003) was an American educator and civil rights activist. Her son, Emmett Till , was murdered at age 14 in Drew, Mississippi on August 28, 1955, after being accused of offending a white grocery store cashier named Carolyn Bryant. For Emmett\u0027s funeral in Chicago, Mamie Till insisted that the coffin containing his body be left open because, in her words, \"I wanted the world to see what th...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Martin Luther King", "label": "Martin Luther King", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/d/de/Martin_Luther_King%27s_Boyhood_Home.jpg/250px-Martin_Luther_King%27s_Boyhood_Home.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMartin Luther King\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eMartin Luther King Q8027 Martin Luther King Jr. (born Michael King Jr. ; January 15, 1929 \u2013 April 4, 1968) was an American civil rights activist and Baptist minister who was a leader of the civil rights movement from 1955 until his assassination in 1968. He advanced civil rights for people of color in the United States through the use of nonviolent resistance and civil disobedience against Jim Crow laws and other forms of legalized discrimination , which most commonly affected African Americans ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Mass Extinction Events", "label": "Mass Extinction Events", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/06/Extinction_intensity.svg/330px-Extinction_intensity.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMass Extinction Events\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eMerge synonyms Mass extinction events Q55814 Synonyms: Mass Extinction Events (canonical) extinction event mass extinction event An extinction event (also known as a mass extinction or biotic crisis ) is a widespread and rapid decrease in the biodiversity on Earth . Such an event is identified by a sharp fall in the diversity and abundance of multicellular organisms . It occurs when the rate of extinction increases with respect to the background extinction rate and the rate of speciation .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Mauna Loa Observatory", "label": "Mauna Loa Observatory", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/ee/NOAA_Mauna_Loa_Observatory_in_Hawaii.png/250px-NOAA_Mauna_Loa_Observatory_in_Hawaii.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMauna Loa Observatory\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eMauna Loa Observatory Q622590 Mauna Loa Observatory ( MLO ) is an atmospheric baseline station on Mauna Loa on the island of Hawai\u02bbi , located in the US state of Hawaii . Mauna Loa Observatory.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Met Office", "label": "Met Office", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/thumb/f/f4/Met_Office.svg/250px-Met_Office.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMet Office\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eMet Office Q1851405 The Met Office , previously the Meteorological Office until November 2000, is the United Kingdom\u0027s national weather and climate service. It is an executive agency and trading fund of the Department for Science, Innovation and Technology and is led by CEO Penelope Endersby , who took on the role as Chief Executive in December 2018 and is the first woman to do so. The Met Office makes meteorological predictions across all timescales from weather forecasts to climate change .\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Metaphysics", "label": "Metaphysics", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/bb/Aristotle%2C_Metaphysics%2C_Incunabulum.jpg/250px-Aristotle%2C_Metaphysics%2C_Incunabulum.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMetaphysics\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eMetaphysics Q35277 Metaphysics is the branch of philosophy that examines the basic structure of reality . It is traditionally seen as the study of mind-independent features of the world, but some theorists view it as an inquiry into the conceptual framework of human understanding. Some philosophers, including Aristotle , designate metaphysics as first philosophy to suggest that it is more fundamental than other forms of philosophical inquiry. The beginning of Aristotle\u0027s Metaphysics , one of the...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "methane", "label": "methane", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/en/thumb/8/8a/OOjs_UI_icon_edit-ltr-progressive.svg/20px-OOjs_UI_icon_edit-ltr-progressive.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emethane\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eMethane Q37129 Methane ( US : / \u02c8 m \u025b \u03b8 e\u026a n / METH -ayn , UK : / \u02c8 m i\u02d0 \u03b8 e\u026a n / MEE -thayn ) is a chemical compound with the chemical formula CH 4 (one carbon atom bonded to four hydrogen atoms). It is a group-14 hydride , the simplest alkane , and the main constituent of natural gas . The abundance of methane on Earth makes it an economically attractive fuel , although capturing and storing it is difficult because it is a gas at standard temperature and pressure . In the Earth\u0027s atmosphere me...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "mining", "label": "mining", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Sulphur_Mining_at_Kawah_Ijen_3.jpg/500px-Sulphur_Mining_at_Kawah_Ijen_3.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emining\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eMining Q44497 Mining is the extraction of geological materials and minerals from the surface of the Earth . Mining is required to obtain most materials that cannot be grown through agricultural processes , or feasibly created artificially in a laboratory or factory. Ores recovered by mining include metals , .jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emodernity\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eModernity Q11084414 Modernity , a topic in the humanities and social sciences , is both a historical period (the modern era ) and the ensemble of particular socio - cultural norms , attitudes, and practices that arose in the wake of the Renaissance \u2014in the Age of Reason of 17th-century thought and the 18th-century Enlightenment . Commentators variously consider the era of modernity to have ended by 1930, with World War II in 1945, or as late as the period falling between the 1980s and 1990s; the...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Money", "label": "Money", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/20/Euro_coins_and_banknotes_%28cropped%29.jpg/500px-Euro_coins_and_banknotes_%28cropped%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMoney\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eMoney Q1368 Money is any item or verifiable record that is generally accepted as payment for goods and services and repayment of debts , such as taxes , in a particular country or socio-economic context. The primary functions which distinguish money are: medium of exchange , a unit of account , a store of value and sometimes, a standard of deferred payment . Euro banknotes and coins\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Montreal Protocol", "label": "Montreal Protocol", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Ozone_Hole_2024_Update.webp/250px-Ozone_Hole_2024_Update.webp.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eMontreal Protocol\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eMontreal Protocol Q219438 The Montreal Protocol , officially the Montreal Protocol on Substances That Deplete the Ozone Layer is an international treaty designed to protect the ozone layer by phasing out the production of numerous substances that are responsible for ozone depletion . It was agreed on 16 September 1987, and entered into force on 1 January 1989. Since then it has undergone several amendments and adjustments, with revisions agreed to in 1990 ( London ), 1992 ( Copenhagen ), 1995 ( ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "morality", "label": "morality", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/ab/Tintoretto_Allegory.jpg/250px-Tintoretto_Allegory.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emorality\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eMorality Q48324 Morality (from Latin moralitas \u0027 manner, character , proper behavior \u0027 ) is a doctrine or system of moral conduct which involves evaluative judgments about agents and actions, including assessments of actions as moral or immoral behavior and of character traits as virtues or vices , such as honesty or cruelty. Allegory with a portrait of a Venetian senator (Allegory of the morality of earthly things) , attributed to Tintoretto , 1585\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "music", "label": "music", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/7/7b/The_Sounds_of_Earth_-_GPN-2000-001976.jpg/330px-The_Sounds_of_Earth_-_GPN-2000-001976.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003emusic\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eMusic Q638 Music is the arrangement of sound to create some combination of form , harmony , melody , rhythm , or otherwise expressive content . Music is generally agreed to be a cultural universal that is present in all human societies. Definitions of music vary widely in substance and approach. While scholars agree that music is defined by a small number of specific elements , there is no consensus as to what these necessary elements are. Music is often characterized as a highly versatile mediu...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "NASA", "label": "NASA", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/ae/NASA_seal.svg/250px-NASA_seal.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eNASA\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eNASA Q23548 The National Aeronautics and Space Administration ( NASA / \u02c8 n \u00e6 s \u0259 / ) is an independent agency of the U.S. federal government responsible for the United States\u0027 civil space program and for research in aeronautics and space exploration. Headquartered in Washington, D.C. , NASA operates ten field centers across the US and is organized into mission directorates for Science, Space Operations, Exploration Systems Development, Space Technology, Aeronautics Research , and Mission Support...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "national government", "label": "national government", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003enational government\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eNational government Q16877816 A national government is the government of a nation.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "nationalism", "label": "nationalism", "shape": "dot", "size": 13.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/%22Onward_to_Victory%22%2C_World_War_I_Allied_propaganda_postcard.jpg/250px-%22Onward_to_Victory%22%2C_World_War_I_Allied_propaganda_postcard.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003enationalism\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eNationalism Q6235 Nationalism is an ideology or movement that holds that the nation should be congruent with the state . As a movement, it presupposes the existence and tends to promote the interests of a particular nation , especially with the aim of gaining and maintaining its sovereignty ( self-determination ) over its perceived homeland to create a nation-state . It holds that the nation should govern itself, free from outside interference ( self-governance ), that a nation is a natural and ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "natural disasters", "label": "natural disasters", "shape": "dot", "size": 11.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Global_Multihazard_Proportional_Economic_Loss_Risk_Deciles_%285457317101%29.jpg/330px-Global_Multihazard_Proportional_Economic_Loss_Risk_Deciles_%285457317101%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003enatural disasters\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eNatural disasters Q8065 A natural disaster is the very harmful impact on a society or community brought by natural phenomenon or hazard . Some examples of natural hazards include avalanches , droughts , earthquakes , floods , heat waves , landslides - including submarine landslides , tropical cyclones , volcanic activity and wildfires . Additional natural hazards include blizzards , dust storms , firestorms , hails , ice storms , sinkholes , thunderstorms , tornadoes and tsunamis . Economic loss...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Netherlands Environmental Assessment Agency", "label": "Netherlands Environmental Assessment Agency", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e6/Bezuidenhoutseweg_30_entrance_%28April_2020%29.jpg/250px-Bezuidenhoutseweg_30_entrance_%28April_2020%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eNetherlands Environmental Assessment Agency\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eNetherlands Environmental Assessment Agency Q2367258 The Netherlands Environmental Assessment Agency ( Dutch : Planbureau voor de Leefomgeving - abbr. PBL ) is a Dutch research institute that advises the Dutch government on environmental policy and regional planning issues. Operating as an autonomous entity within the Dutch Government organization, specifically under the Ministry of Infrastructure and Water Management . While primarily associated with the Ministry of Infrastructure and Water Man...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "noble gases", "label": "noble gases", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Helium_spectrum.jpg/330px-Helium_spectrum.jpg . Fusion plasma i...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "nuclear power", "label": "nuclear power", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/24/2011-05-10_18-57-46_Switzerland_-_Wil_crop.jpg/250px-2011-05-10_18-57-46_Switzerland_-_Wil_crop.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003enuclear power\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eNuclear power Q12739 Nuclear power is the use of nuclear reactions to produce electricity . Nuclear power can be obtained from nuclear fission , nuclear decay and nuclear fusion reactions. Presently, the vast majority of electricity from nuclear power is produced by nuclear fission of uranium and plutonium in nuclear power plants . Nuclear decay processes are used in niche applications such as radioisotope thermoelectric generators in some space probes such as Voyager 2 . Reactors producing cont...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "ozone layer", "label": "ozone layer", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/ISS041-E-105277_-_View_of_the_Northern_Territory.jpg/250px-ISS041-E-105277_-_View_of_the_Northern_Territory.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eozone layer\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eOzone layer Q79995 The ozone layer or ozone shield is a region of Earth \u0027s stratosphere that absorbs most of the Sun \u0027s ultraviolet radiation. It contains a high concentration of ozone (O 3 ) in relation to other parts of the atmosphere, although still small in relation to other gases in the stratosphere. The ozone layer peaks at 8 to 15 parts per million of ozone, while the average ozone concentration in Earth\u0027s atmosphere as a whole is about 0.3 parts per million. The ozone layer is mainly fou...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Pakistan", "label": "Pakistan", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/PAK_orthographic.svg/250px-PAK_orthographic.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePakistan\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003ePakistan Q843 Pakistan , officially the Islamic Republic of Pakistan , is a country in South Asia . It is the fifth-most populous country , with a population of over 241.5 million, having the second-largest Muslim population as of 2023. Islamabad is the nation\u0027s capital, while Karachi is its largest city and financial centre . Pakistan is the 33rd-largest country by area . Bounded by the Arabian Sea on the south, the Gulf of Oman on the southwest, and the Sir Creek on the southeast, it shares la...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "paradigms", "label": "paradigms", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eparadigms\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eMerge synonyms Paradigm Q28643 Synonyms: paradigm paradigms (canonical) In science and philosophy , a paradigm ( / \u02c8 p \u00e6r \u0259 d a\u026a m / PARR -\u0259-dyme ) is a distinct set of concepts or thought patterns, including theories, research methods , postulates, and standards for what constitute legitimate contributions to a field. The word paradigm is Greek in origin, meaning \"pattern\". It is closely related to the discussion of theory-ladenness in the philosophy of science.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "paradox", "label": "paradox", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/2/25/Liars_paradox.svg/250px-Liars_paradox.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eparadox\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eParadox Q483372 A paradox is a logically self-contradictory statement or a statement that runs contrary to one\u0027s expectation. It is a statement that, despite apparently valid reasoning from true or apparently true premises, leads to a seemingly self-contradictory or a logically unacceptable conclusion. A paradox usually involves contradictory-yet-interrelated elements that exist simultaneously and persist over time. They result in \"persistent contradiction between interdependent elements\" leadin...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Paris Agreement", "label": "Paris Agreement", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/ParisAgreement.svg/330px-ParisAgreement.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eParis Agreement\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eParis Agreement Q21707860 The Paris Agreement (also called the Paris Accords or Paris Climate Accords ) is an international treaty on climate change that was signed in 2016. The treaty covers climate change mitigation , adaptation , and finance . The Paris Agreement was negotiated by 196 parties at the 2015 United Nations Climate Change Conference near Paris , France. As of January 2026, 194 members of the United Nations Framework Convention on Climate Change (UNFCCC) are parties to the agreemen...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Periodic Table", "label": "Periodic Table", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/89/Colour_18-col_PT_with_labels.png/330px-Colour_18-col_PT_with_labels.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePeriodic Table\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003ePeriodic Table Q10693 The periodic table , also known as the periodic table of the elements , is an ordered arrangement of the chemical elements into rows (\" periods \") and columns (\" groups \"). An icon of chemistry , the periodic table is widely used in physics and other sciences. It is a depiction of the periodic law , which states that when the elements are arranged in order of their atomic numbers an approximate recurrence of their properties is evident. The table is divided into four roughl...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff9933", "font": {"color": "#FFFFFF"}, "id": "Philosophy", "label": "Philosophy", "shape": "dot", "size": 14.8, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Le_Penseur_by_Rodin_%28Kunsthalle_Bielefeld%29_2014-04-10.JPG/330px-Le_Penseur_by_Rodin_%28Kunsthalle_Bielefeld%29_2014-04-10.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ePhilosophy\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003ePhilosophy Q5891 Philosophy (from Ancient Greek philosoph\u00eda lit. \u0027 love of wisdom \u0027 ) is a systematic study of general and fundamental questions concerning topics like existence , knowledge , mind , reason , language , and value . It is a rational and critical inquiry that reflects on its methods and assumptions. The statue The Thinker by Auguste Rodin is a symbol of philosophical thought.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "photosynthesis", "label": "photosynthesis", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/Photosynthesis_en.svg/500px-Photosynthesis_en.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ephotosynthesis\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003ePhotosynthesis Q11982 Photosynthesis ( / \u02cc f o\u028a t \u0259 \u02c8 s \u026a n \u03b8 \u0259 s \u026a s / FOH -t\u0259- SINTH -\u0259-sis ) is a system of biological processes by which photopigment -bearing autotrophic organisms , such as most plants , algae and cyanobacteria , convert light energy \u2014 typically from sunlight \u2014 into the chemical energy necessary to fuel their metabolism . The term photosynthesis usually refers to oxygenic photosynthesis , a process that releases oxygen as a byproduct of water splitting . Photosynthetic orga...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "pigs", "label": "pigs", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/88/Bosse_2018_pig_lineages.png/500px-Bosse_2018_pig_lineages.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epigs\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003ePigs Q787 The pig ( Sus domesticus ), also called swine ( pl. : swine) or hog , is an omnivorous , domesticated , even-toed, hoofed mammal . It is named the domestic pig when distinguishing it from other members of the genus Sus . Some authorities consider it a subspecies of Sus scrofa (the wild boar or Eurasian boar); other authorities consider it a distinct species . Pigs were domesticated independently twice during the Neolithic , in the Near East around the Tigris Basin , and in China . When...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "planetary boundaries", "label": "planetary boundaries", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/e/e2/The_Planetary_Boundaries_diagram.pdf/page1-250px-The_Planetary_Boundaries_diagram.pdf.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eplanetary boundaries\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003ePlanetary boundaries Q961310 Planetary boundaries are a framework to describe limits to the impacts of human activities on the Earth system . Beyond these limits, the environment may not be able to continue to self-regulate. This would mean the Earth system would leave the period of stability of the Holocene , in which human society developed. The \"Planetary Boundaries (PBs) diagram visually represents the current status of the nine PB processes that regulate our planet\u0027s health. Each process is...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "planetary systems", "label": "planetary systems", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wiki pulation growth amounts to around 70 million annually, or 0.85% per year. As of 2024, The United Nations projects that global population will peak in the mid-2080s at around 10.3 billion. The UN\u0027s estimates have decreased strongly in recent years due to sharp declines in global ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "populations", "label": "populations", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003epopulations\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eMerge synonyms Population Q2625603 Synonyms: population populations (canonical) In biology , a population of organisms is a group of individuals of the same species , defined by a discontinuity or disjunction from other groups of individuals in certain characteristics, such as living area, genetic attributes, demographic structure. Among biologists, the term definition varies, in some cases significantly, and sometimes those variations can be confusing. There are also plenty of other terms to de...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "problem solving", "label": "problem solving", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eproblem solving\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eProblem solving Q730920 Problem solving is the process of achieving a goal by overcoming obstacles, a frequent part of most activities. Problems in need of solutions range from simple personal tasks (e.g. n surface albedo and solar irradiance . In more technical terms, it is defined as \"the change in the net, downward minus upward, radiative flux (expressed in W/m 2 ) due to a change in an external ...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "reality", "label": "reality", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/Hubble_ultra_deep_field_high_rez_edit1.jpg/250px-Hubble_ultra_deep_field_high_rez_edit1.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ereality\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eReality Q9510 Reality is the state of everything that exists, not how they might be imagined. Different cultures and academic disciplines conceptualize it in various ways. Hubble Ultra-Deep Field image of distant galaxies illustrates a challenge to understanding reality at any given instant: the light from these stars was emitted billions of years ago and many of these stars have moved, merged, or evolved since then.\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "reasoning", "label": "reasoning", "shape": "dot", "size": 12.4, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Goya_Caprichos3.jpg/250px-Goya_Caprichos3.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003ereasoning\u tatesman, widely recognised as one of the most influential figures of the French Revolution . Robespierre fervently campaigned for the voting rights of all men and their unimpeded admission to the National Guard . Additionally, he advocated the right to petition , the right to bear arms in self-defence, and the abolit...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Rosa Parks", "label": "Rosa Parks", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/b1/Rosa_Parks%2C_November_1956_%28cropped%29.jpg/250px-Rosa_Parks%2C_November_1956_%28cropped%29.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eRosa Parks\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eRosa Parks Q41921 Rosa Louise McCauley Parks (February 4, 1913 \u2013 October 24, 2005) was an American civil rights activist . She is best known for her 1955 refusal to move from her seat on a bus in Montgomery, Alabama , in defiance of Jim Crow racial segregation laws , which sparked the Montgomery bus boycott . She is sometimes known as the \"mother of the civil rights movement \".\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Rousseau", "label": "Rousseau", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Rousseau_Geneve_House.JPG/250px-Rousseau_Geneve_House.JPG\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px hemati...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "scientific research", "label": "scientific research", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/The_Scientific_Method.svg/250px-The_Scientific_Method.svg.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003escientific research\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eScientific research Q46857 The scientific method is an empirical method for acquiring knowledge through careful observation , rigorous skepticism , hypothesis testing , and experimental validation. Developed from ancient and medieval practices, it acknowledges that cognitive assumptions can distort the interpretation of the observation . The scientific method has characterized science since at least the 17th century. Scientific inquiry includes creating a testable hypothesis through inductive re...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "social media", "label": "social media", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Social_media_collection_2026.png/330px-Social_media_collection_2026.png\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003esocial media\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eSocial media Q202833 Social media are new media technologies that facilitate the creation , sharing and aggregation of content (such as ideas, interests, and other forms of expression) amongst virtual communities and networks . Common features include: A variety of popular social media app icons\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "Socrates", "label": "Socrates", "shape": "dot", "size": 11.2, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedia/commons/thumb/b/bc/Socrate_du_Louvre.jpg/250px-Socrate_du_Louvre.jpg\u0027 style=\u0027max-width:120px;float:right;margin-left:10px;border-radius:4px\u0027\u003e\n            \u003ch3 style=\u0027margin:0 0 6px;color:#66b2ff;font-size:16px\u0027\u003eSocrates\u003c/h3\u003e\n            \u003cdiv style=\u0027font-size:12px;color:#ddd;line-height:1.4;\u0027\u003eSocrates Q913 Socrates ( / \u02c8 s \u0252 k r \u0259 t i\u02d0 z / ; Ancient Greek : \u03a3\u03c9\u03ba\u03c1\u03ac\u03c4\u03b7\u03c2 , romanized : S\u014dkr\u00e1t\u0113s ; c. 470 \u2013 399 BC) was an ancient Greek philosopher from Classical Athens , perhaps the first Western moral philosopher , and a major inspiration on his student Plato , who largely founded the tradition of Western philosophy . An enigmatic figure, Socrates authored no texts and is known mainly through the posthumous accounts of classical writers , particularly his students Plato and Xenophon . These...\u003c/div\u003e\n        \u003c/div\u003e"}, {"color": "#ff5555", "font": {"color": "#FFFFFF"}, "id": "solar panels", "label": "solar panels", "shape": "dot", "size": 10.6, "title": "\n        \u003cdiv style=\u0027max-width:420px;color:#fff;font-family:system-ui,Helvetica,Arial;\u0027\u003e\n            \u003cimg src=\u0027https://upload.wikimedia.org/wikipedi
